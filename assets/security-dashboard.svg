<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <style>
      .card-title { fill: #00ffc8; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 800; letter-spacing: 1px; }
      .card-sub { fill: #94a3b8; font-family: system-ui, sans-serif; font-size: 11px; }
      .card-stat { fill: #38bdf8; font-family: monospace; font-size: 12px; font-weight: bold; }
      .pulse-green { animation: pulse 2s infinite; }
      @keyframes pulse {
        0% { fill-opacity: 0.3; }
        50% { fill-opacity: 1; }
        100% { fill-opacity: 0.3; }
      }
    </style>
  </defs>

  <!-- Card 1: API Security -->
  <g transform="translate(0, 0)">
    <rect width="270" height="90" rx="8" fill="url(#cardGrad)" stroke="#00ffc8" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="25" cy="28" r="6" fill="#00ffc8" class="pulse-green"/>
    <text x="40" y="32" class="card-title">RUNTIME API TELEMETRY</text>
    <text x="25" y="55" class="card-sub">eBPF Kernel Probes &amp; BOLA Detection</text>
    <text x="25" y="74" class="card-stat">STATUS: ACTIVE [eBPF/Rust]</text>
  </g>

  <!-- Card 2: AI Intelligence -->
  <g transform="translate(290, 0)">
    <rect width="270" height="90" rx="8" fill="url(#cardGrad)" stroke="#00b4d8" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="25" cy="28" r="6" fill="#00b4d8" class="pulse-green"/>
    <text x="40" y="32" class="card-title" fill="#00b4d8">CYBERSECURITY LLM</text>
    <text x="25" y="55" class="card-sub">Domain QLoRA &amp; Multi-Agent Consensus</text>
    <text x="25" y="74" class="card-stat" fill="#00b4d8">STATUS: OPERATIONAL [CyberQwen]</text>
  </g>

  <!-- Card 3: Threat Hunting -->
  <g transform="translate(580, 0)">
    <rect width="270" height="90" rx="8" fill="url(#cardGrad)" stroke="#ff0055" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="25" cy="28" r="6" fill="#ff0055" class="pulse-green"/>
    <text x="40" y="32" class="card-title" fill="#ff0055">AUTH SOC &amp; THREAT HUNTING</text>
    <text x="25" y="55" class="card-sub">UBA Threat Scoring &amp; SOAR Actions</text>
    <text x="25" y="74" class="card-stat" fill="#ff0055">STATUS: MONITORING [Flask/SOAR]</text>
  </g>

  <!-- Row 2 -->
  <!-- Card 4: OSINT Engine -->
  <g transform="translate(0, 105)">
    <rect width="410" height="85" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="25" cy="28" r="6" fill="#38bdf8" class="pulse-green"/>
    <text x="40" y="32" class="card-title" fill="#38bdf8">OSINT RECONNAISSANCE ENGINE</text>
    <text x="25" y="55" class="card-sub">Certificate Transparency Log Harvester (crt.sh) &amp; Multi-Threaded DNS</text>
    <text x="25" y="72" class="card-stat">SURFACE MAPPING: ACTIVE</text>
  </g>

  <!-- Card 5: DFIR Research Labs -->
  <g transform="translate(440, 105)">
    <rect width="410" height="85" rx="8" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="25" cy="28" r="6" fill="#a855f7" class="pulse-green"/>
    <text x="40" y="32" class="card-title" fill="#a855f7">10-CYCLE CYBERSECURITY LABS</text>
    <text x="25" y="55" class="card-sub">Protocol Dissection, Memory Forensics, Windows &amp; Linux Exploitation</text>
    <text x="25" y="72" class="card-stat" fill="#a855f7">RESEARCH DOMAINS: 10 ACTIVE CYCLES</text>
  </g>
</svg>