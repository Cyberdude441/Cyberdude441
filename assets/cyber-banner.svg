<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06090e" />
      <stop offset="50%" stop-color="#0a1017" />
      <stop offset="100%" stop-color="#040608" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="50%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00ffc8" stroke-width="0.3" stroke-opacity="0.12" />
      <circle cx="30" cy="0" r="1" fill="#00ffc8" fill-opacity="0.25" />
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="240" rx="12" fill="url(#bgGrad)" stroke="#00ffc8" stroke-width="1.5" stroke-opacity="0.4" />
  <rect width="900" height="240" rx="12" fill="url(#cyberGrid)" />

  <!-- Top Tech Bar -->
  <path d="M 0 0 L 220 0 L 250 30 L 650 30 L 680 0 L 900 0" fill="none" stroke="#00ffc8" stroke-width="1.2" stroke-opacity="0.5" />
  <rect x="360" y="8" width="180" height="15" rx="3" fill="#0d1821" stroke="#00b4d8" stroke-width="0.8" />
  <text x="450" y="19" fill="#00f5d4" font-family="'Courier New', monospace" font-size="9" font-weight="bold" text-anchor="middle" letter-spacing="3">SOC NODE // SEC-01</text>

  <!-- Left Radar Deco -->
  <g transform="translate(70, 120)">
    <circle r="42" fill="none" stroke="#00ffc8" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="4,4" />
    <circle r="26" fill="none" stroke="#00b4d8" stroke-width="1" stroke-opacity="0.5" />
    <circle r="8" fill="#00ffc8" fill-opacity="0.3" />
    <line x1="-50" y1="0" x2="50" y2="0" stroke="#00ffc8" stroke-width="0.6" stroke-opacity="0.3" />
    <line x1="0" y1="-50" x2="0" y2="50" stroke="#00ffc8" stroke-width="0.6" stroke-opacity="0.3" />
    <line x1="0" y1="0" x2="28" y2="-28" stroke="#ff0055" stroke-width="1.5" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Main Titles -->
  <g transform="translate(450, 95)" text-anchor="middle">
    <text y="0" fill="url(#cyanGlow)" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="4" filter="url(#glow)">SOUMAVA DAS</text>
    <text y="30" fill="#e2e8f0" font-family="'Courier New', monospace" font-size="14" font-weight="bold" letter-spacing="5">CYBERSECURITY RESEARCHER &amp; ENGINEER</text>
    <text y="60" fill="#00b4d8" font-family="'Courier New', monospace" font-size="12" letter-spacing="2">DFIR  |  THREAT INTELLIGENCE  |  KERNEL eBPF  |  OFFENSIVE APPS</text>
    <text y="90" fill="#64748b" font-family="'Courier New', monospace" font-size="10" letter-spacing="3">[ SYSTEM INTEGRITY: SECURE  •  DEFENSIVE AUTOMATION: ONLINE ]</text>
  </g>

  <!-- Right Circuit Deco -->
  <g transform="translate(810, 120)" stroke="#00ffc8" stroke-width="1" fill="none" stroke-opacity="0.6">
    <path d="M -30 -30 L 0 -30 L 20 -10 L 20 20 L 0 40 L -20 40" />
    <circle cx="-30" cy="-30" r="3" fill="#00ffc8" />
    <circle cx="-20" cy="40" r="3" fill="#ff0055" />
    <rect x="-10" y="-8" width="16" height="16" fill="#0d1821" stroke="#00b4d8" stroke-width="1" />
  </g>

  <!-- Bottom Tech Bar -->
  <path d="M 0 240 L 200 240 L 230 215 L 670 215 L 700 240 L 900 240" fill="none" stroke="#00ffc8" stroke-width="1.2" stroke-opacity="0.5" />
</svg>