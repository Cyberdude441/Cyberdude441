<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 360" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#06090e"/>
    </linearGradient>
    <style>
      .prompt { fill: #00ffc8; font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; font-weight: bold; }
      .command { fill: #f8fafc; font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; }
      .key { fill: #00b4d8; font-family: 'Fira Code', 'Courier New', monospace; font-size: 12.5px; font-weight: bold; }
      .val { fill: #94a3b8; font-family: 'Fira Code', 'Courier New', monospace; font-size: 12.5px; }
      .highlight { fill: #00ffc8; font-family: 'Fira Code', 'Courier New', monospace; font-size: 12.5px; font-weight: bold; }
      .alert { fill: #ff0055; font-family: 'Fira Code', 'Courier New', monospace; font-size: 12.5px; font-weight: bold; }
      .cursor {
        animation: blink 1s infinite;
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Terminal Window Frame -->
  <rect width="850" height="360" rx="10" fill="url(#termBg)" stroke="#1e293b" stroke-width="1.5"/>
  
  <!-- Header Bar -->
  <rect width="850" height="34" rx="10" fill="#111827"/>
  <rect y="24" width="850" height="10" fill="#111827"/>
  <circle cx="20" cy="17" r="5.5" fill="#ef4444"/>
  <circle cx="38" cy="17" r="5.5" fill="#f59e0b"/>
  <circle cx="56" cy="17" r="5.5" fill="#10b981"/>
  <text x="425" y="22" fill="#64748b" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" text-anchor="middle">cyberdude@soc-command-node: ~/research</text>

  <!-- Terminal Body Content -->
  <g transform="translate(25, 62)">
    <!-- Line 1: Prompt & Command -->
    <text x="0" y="0" class="prompt">┌──(cyberdude㉿soc-core)-[~/intel]</text>
    <text x="0" y="20" class="prompt">└─$</text>
    <text x="35" y="20" class="command">cat /etc/security/identity.json</text>

    <!-- JSON Output -->
    <text x="20" y="48" class="key">"researcher":</text>
    <text x="145" y="48" class="val">"Soumava Das",</text>

    <text x="20" y="70" class="key">"focus_areas":</text>
    <text x="145" y="70" class="val">[</text>
    <text x="160" y="70" class="highlight">"Threat Intelligence"</text>
    <text x="345" y="70" class="val">, </text>
    <text x="365" y="70" class="highlight">"DFIR &amp; Memory Triage"</text>
    <text x="560" y="70" class="val">, </text>
    <text x="580" y="70" class="highlight">"Kernel eBPF"</text>
    <text x="690" y="70" class="val">],</text>

    <text x="20" y="92" class="key">"active_systems":</text>
    <text x="160" y="92" class="val">"</text>
    <text x="170" y="92" class="highlight">API-Sentinel</text>
    <text x="280" y="92" class="val">(eBPF/Rust)  •  </text>
    <text x="410" y="92" class="highlight">CyberQwen-AI</text>
    <text x="520" y="92" class="val">(LLM/QLoRA)  •  </text>
    <text x="660" y="92" class="highlight">BruteForce-SOC</text>
    <text x="790" y="92" class="val">",</text>

    <text x="20" y="114" class="key">"telemetry_state":</text>
    <text x="160" y="114" class="alert">[ MONITORING_ACTIVE // 0 CRITICAL BREACHES ]</text>
    <text x="590" y="114" class="val">,</text>

    <text x="20" y="136" class="key">"status":</text>
    <text x="100" y="136" class="highlight">"READY_FOR_ENGAGEMENT"</text>

    <!-- Line 2: Second Prompt -->
    <text x="0" y="176" class="prompt">┌──(cyberdude㉿soc-core)-[~/intel]</text>
    <text x="0" y="196" class="prompt">└─$</text>
    <text x="35" y="196" class="command">./init_defenses.sh --daemon</text>

    <!-- Line 3 Output -->
    <text x="20" y="224" class="val">[+] Kernel eBPF hooks mounted successfully onto Linux socket layers...</text>
    <text x="20" y="244" class="val">[+] Multi-agent LLM consensus reasoning active for real-time artifact analysis...</text>
    <text x="20" y="264" class="highlight">[✔] Command center initialized. Defense perimeter secure.</text>

    <!-- Cursor -->
    <rect x="495" y="252" width="8" height="15" fill="#00ffc8" class="cursor"/>
  </g>
</svg>